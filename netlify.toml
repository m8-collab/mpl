[build]
  publish = "."
  command = ""

# Single-page app: send unknown paths to index.html so hash-based
# routing (#/table, #/club/ash, etc.) keeps working on refresh/deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
